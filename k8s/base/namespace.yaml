apiVersion: v1
kind: Namespace
metadata:
  name: devguard
  labels:
    name: devguard
    app.kubernetes.io/name: devguard
    app.kubernetes.io/version: "2.4.0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devguard-config
  namespace: devguard
data:
  APP_NAME: "DevGuard Agent"
  APP_VERSION: "2.4.0"
  DEBUG: "false"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_PREFIX: "/api"
  LOG_LEVEL: "INFO"
  MAX_WORKERS: "4"
  ENABLE_FLOW_A: "true"
  ENABLE_FLOW_B: "true"
  ENABLE_SIMULATION: "true"
  ENABLE_AI_ANALYSIS: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: devguard-secrets
  namespace: devguard
type: Opaque
stringData:
  # 这些值需要在部署时替换
  DATABASE_URL: "postgresql://devguard:changeme@postgres:5432/devguard"
  REDIS_URL: "redis://redis:6379/0"
  GITHUB_TOKEN: "${GITHUB_TOKEN}"
  GITLAB_TOKEN: "${GITLAB_TOKEN}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET}"
