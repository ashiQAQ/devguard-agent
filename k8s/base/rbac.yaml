apiVersion: v1
kind: ServiceAccount
metadata:
  name: devguard
  namespace: devguard
  labels:
    app.kubernetes.io/name: devguard
    app.kubernetes.io/version: "2.4.0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devguard
  namespace: devguard
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devguard
  namespace: devguard
subjects:
  - kind: ServiceAccount
    name: devguard
    namespace: devguard
roleRef:
  kind: Role
  name: devguard
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devguard-cpp-data
  namespace: devguard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
