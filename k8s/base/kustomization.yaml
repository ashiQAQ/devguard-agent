apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devguard

resources:
  - namespace.yaml
  - rbac.yaml
  - postgres.yaml
  - redis.yaml
  - api-deployment.yaml
  - cpp-engine-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: devguard
  app.kubernetes.io/version: "2.4.0"
  app.kubernetes.io/managed-by: kustomize

images:
  - name: devguard/api
    newTag: "2.4.0"
  - name: devguard/cpp-engine
    newTag: "2.4.0"
  - name: devguard/frontend
    newTag: "2.4.0"

configMapGenerator:
  - name: devguard-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO

secretGenerator:
  - name: devguard-secrets
    behavior: merge
    envs:
      - secrets.env
