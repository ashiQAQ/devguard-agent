apiVersion: apps/v1
kind: Deployment
metadata:
  name: devguard-api
  namespace: devguard-prod
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          env:
            - name: MAX_WORKERS
              value: "8"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devguard-cpp-engine
  namespace: devguard-prod
spec:
  template:
    spec:
      containers:
        - name: cpp-engine
          resources:
            requests:
              memory: "2Gi"
              cpu: "2000m"
            limits:
              memory: "8Gi"
              cpu: "8000m"
